services:
  warp:
    image: supportss2t/cf-warp-socat:local
    container_name: cf-warp-test
    privileged: true
    cap_add:
      - NET_ADMIN
      - SYS_ADMIN
    environment:
      - WARP_TOKEN=${WARP_TOKEN}
      - VNET=${VNET:-}
    volumes:
      - ./warp-startup.sh:/warp-startup.sh:ro
      - warp_state:/var/lib/cloudflare-warp
    restart: unless-stopped

volumes:
  warp_state:
